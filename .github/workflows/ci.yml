name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

  unit:
    name: Unit and Golden (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  foundation-performance:
    name: Foundation performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: >-
          node scripts/benchmark-foundation.mjs
          --check
          --report benchmark-results/foundation.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-performance
          path: benchmark-results/foundation.json
          if-no-files-found: warn
          retention-days: 14

  product-e2e:
    name: Studio desktop, web and media E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify media toolchain
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -h encoder=libx264
          ffmpeg -hide_banner -h encoder=libvpx-vp9
      - name: Run Electron workflow in Xvfb
        run: xvfb-run --auto-servernum pnpm test:e2e

  web-container:
    name: Web container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag kineweave-web:ci .
      - name: Verify Web Studio and cloud host
        run: |
          docker run --detach --name kineweave-web-ci --publish 127.0.0.1:18080:8080 kineweave-web:ci
          trap 'docker rm --force kineweave-web-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs kineweave-web-ci; exit 1; fi
            sleep 1
          done
          docker exec kineweave-web-ci ffmpeg -hide_banner -h encoder=libx264 >/dev/null
          docker exec kineweave-web-ci ffmpeg -hide_banner -h encoder=libvpx-vp9 >/dev/null
          curl --fail --silent http://127.0.0.1:18080/ | grep --quiet 'KineWeave Studio'
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data '{"projectLocator":"kw+cloud://default"}' \
            http://127.0.0.1:18080/api/project/open | grep --quiet '"ok":true'
